  // --- Set page name and URL in forms ---

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.page-name-field').forEach(i => i.value = document.title);
    document.querySelectorAll('.page-url-field').forEach(i => i.value = location.href);
  });

  // --- Menu logic ---
  const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
  document.documentElement.style.setProperty('--scrollbar-width', `${scrollbarWidth}px`);

  document.getElementById('menu').setAttribute('aria-hidden', 'true');
  const menuLinks = document.getElementById('menu').querySelectorAll('a');
  menuLinks.forEach(link => link.setAttribute('tabindex', '-1'));

  // Scroll background logic - now checks if trigger exists
  let lastScrollY = window.scrollY;

  function handleScroll() {
    const trigger = document.getElementById('trigger');
    const nav = document.getElementById('nav');
    const currentScrollY = window.scrollY;

    // Only handle scroll-based behaviors if trigger element exists
    if (trigger) {
      const triggerRect = trigger.getBoundingClientRect();
      const viewportHeight = window.innerHeight;

      // Handle background
      if (triggerRect.top <= viewportHeight * 0.10 || triggerRect.top >= viewportHeight) {
        nav.classList.add('has-bg');
      } else {
        nav.classList.remove('has-bg');
      }

      // Handle scroll direction class
      if (!nav.classList.contains('is-open')) {
        if (currentScrollY > lastScrollY && currentScrollY > 100) {
          nav.classList.add('is-scrolled');
        } else if (currentScrollY < lastScrollY) {
          nav.classList.remove('is-scrolled');
        }
      }
    }

    lastScrollY = currentScrollY;
  }

  // Only add scroll listeners if trigger exists
  const trigger = document.getElementById('trigger');
  if (trigger) {
    window.addEventListener('scroll', handleScroll);
    window.addEventListener('resize', handleScroll);
    handleScroll(); // Initial check
  }

  document.getElementById('menuToggle').addEventListener('click', function() {
    const nav = document.getElementById('nav');
    const scrollY = window.scrollY;
    const menu = document.getElementById('menu');
    const menuLinks = menu.querySelectorAll('a');

    nav.classList.toggle('is-open');

    // Only remove scrolled class if trigger exists
    if (document.getElementById('trigger')) {
      nav.classList.remove('is-scrolled');
    }

    document.body.classList.toggle('menu-open');

    if (nav.classList.contains('is-open')) {
      // Set the body position immediately
      document.body.style.top = `-${scrollY}px`;
      document.body.style.position = 'fixed';
      document.body.style.width = '100%';

      // Make menu immediately scrollable
      menu.style.overflowY = 'auto';
      menu.style.webkitOverflowScrolling = 'touch'; // For iOS momentum scrolling

      // Update accessibility
      menu.setAttribute('aria-hidden', 'false');
      menuLinks.forEach(link => link.setAttribute('tabindex', '0'));

      // Force a reflow to ensure styles are applied immediately
      void menu.offsetHeight;
    } else {
      const scrollY = parseInt(document.body.style.top || '0') * -1;
      document.body.style.top = '';
      document.body.style.position = '';
      document.body.style.width = '';
      window.scrollTo(0, scrollY);
      menu.setAttribute('aria-hidden', 'true');
      menuLinks.forEach(link => link.setAttribute('tabindex', '-1'));
    }
  });

  function closeMenu() {
    const nav = document.getElementById('nav');
    const menu = document.getElementById('menu');
    const menuLinks = menu.querySelectorAll('a');

    nav.classList.remove('is-open');
    document.body.classList.remove('menu-open');

    menu.setAttribute('aria-hidden', 'true');
    menuLinks.forEach(link => link.setAttribute('tabindex', '-1'));

    const scrollY = parseInt(document.body.style.top || '0') * -1;
    document.body.style.top = '';
    document.body.style.position = '';
    document.body.style.width = '';
    window.scrollTo(0, scrollY);
  }

  document.getElementById('menu').addEventListener('click', function(e) {
    if (e.target.tagName === 'A') {
      closeMenu();
    }
  });

  document.getElementById('menu').addEventListener('keydown', function(e) {
    if (e.target.tagName === 'A' && e.key === 'Enter') {
      closeMenu();
    }
  });
  
  const navmenuBackground = document.getElementById('navmenu-background');
	if (navmenuBackground) {
  	navmenuBackground.addEventListener('click', () => {
    	closeMenu();
  	});
	}


  document.addEventListener('focusin', function(e) {
    const nav = document.getElementById('nav');
    const menu = document.getElementById('menu');
    const menuToggle = document.getElementById('menuToggle');
    if (nav.classList.contains('is-open')) {
      if (!menu.contains(e.target) && e.target !== menuToggle) {
        closeMenu();
      }
    }
  });

  // --- Video Lazy Loader ---
  (function() {
    const videosToLazyLoad = document.querySelectorAll('video[data-lazy-src]');
    if (videosToLazyLoad.length === 0) return;

    // More robust: Use Intersection Observer if available for performance
    if ('IntersectionObserver' in window) {
      const videoObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const video = entry.target;
            const lazySrc = video.getAttribute('data-lazy-src');
            if (lazySrc) {
              // Check if sources already exist (e.g. from previous load attempt or Webflow adding <source>)
              // If they do, and they don't match lazySrc, replace them. Otherwise, add new source.
              let sourceElement = video.querySelector('source');
              if (sourceElement && sourceElement.getAttribute('src') !== lazySrc) {
                sourceElement.setAttribute('src', lazySrc);
              } else if (!sourceElement) {
                sourceElement = document.createElement('source');
                sourceElement.setAttribute('src', lazySrc);
                video.appendChild(sourceElement);
              }
              video.load(); // Important to load the new source
              if(video.hasAttribute('autoplay')) video.play().catch(()=>{}); // Attempt to play if autoplay is set
            }
            video.removeAttribute('data-lazy-src'); // Prevent re-processing
            observer.unobserve(video); // Stop observing once loaded
          }
        });
      }, { rootMargin: "200px 0px" }); // Trigger when video is 200px from viewport

      videosToLazyLoad.forEach(video => videoObserver.observe(video));

    } else { // Fallback for older browsers (less performant)
      function loadVisibleVideos() {
        videosToLazyLoad.forEach(video => {
          if (video.hasAttribute('data-lazy-src')) { // Check if not already processed
            const rect = video.getBoundingClientRect();
            // A simple check if the top of the video is within a certain range of the viewport
            if (rect.top < window.innerHeight + 200 && rect.bottom > -200) {
              const lazySrc = video.getAttribute('data-lazy-src');
              if (lazySrc) {
                let sourceElement = video.querySelector('source');
                if (sourceElement && sourceElement.getAttribute('src') !== lazySrc) {
                  sourceElement.setAttribute('src', lazySrc);
                } else if (!sourceElement) {
                  sourceElement = document.createElement('source');
                  sourceElement.setAttribute('src', lazySrc);
                  video.appendChild(sourceElement);
                }
                video.load();
                if(video.hasAttribute('autoplay')) video.play().catch(()=>{});
              }
              video.removeAttribute('data-lazy-src');
            }
          }
        });
      }
      window.addEventListener('scroll', loadVisibleVideos, { passive: true });
      window.addEventListener('resize', loadVisibleVideos);
      loadVisibleVideos(); // Initial check
    }
  })();

  (function() {
    /**
     * Configuration
     */
    const defaultDuration = 0.6;
    const defaultStagger = 0.05; // Faster stagger for group items
    const defaultY = 30;
    const defaultOpacity = 0;
    const defaultEase = 'power2.out';

    // Delay increment for sub-elements within each group item
    const nestedDelayIncrement = 0.02;

    // Classes you want to auto-animate (update this array as needed)
    const customClasses = ['.fade-up-anim', '.another-custom-class'];

    // Check that GSAP is available
    if (typeof gsap === 'undefined') {
      console.warn('GSAP not found. Make sure it is loaded on this page.');
      return;
    }

    // Create an IntersectionObserver to trigger animations when elements appear in the viewport
    const observer = new IntersectionObserver(onIntersect, {
      root: null,
      rootMargin: '0px 0px -10% 0px',
      threshold: 0.1
    });

    /**
     * Build a combined CSS selector for elements to animate:
     * - All headings (h1–h6)
     * - Custom classes
     * - [data-animate] elements
     *
     * We then filter out any elements with [data-no-animate].
     */
    const headingSelector = 'h1, h2, h3, h4, h5, h6';
    const customClassSelector = customClasses.join(',');
    const animateSelector = '[data-animate]';
    const combinedSelector = [
      headingSelector,
      customClassSelector,
      animateSelector
    ].join(',');

    // Identify animatable elements that are NOT inside a group container and not excluded
    let allMatches = Array.from(document.querySelectorAll(combinedSelector))
      .filter(el => !el.hasAttribute('data-no-animate'));
    const singleElements = allMatches.filter(el => !el.closest('[data-animate-group]'));

    // Identify all animatable elements INSIDE any group container, filtering out exclusions
    const groupInnerElems = Array.from(document.querySelectorAll(`[data-animate-group] ${combinedSelector}`))
      .filter(el => !el.hasAttribute('data-no-animate'));

    // Combine all targets (single elements + group elements) and remove duplicates
    let allPotentialTargets = Array.from(new Set([...singleElements, ...groupInnerElems]));

    // Immediately set them off-screen to avoid any flicker (they start at y=defaultY, opacity=defaultOpacity)
    gsap.set(allPotentialTargets, { y: defaultY, opacity: defaultOpacity });

    // Observe single elements
    singleElements.forEach(el => observer.observe(el));
    // Observe group containers
    const groupContainers = document.querySelectorAll('[data-animate-group]');
    groupContainers.forEach(group => observer.observe(group));

    /**
     * Intersection Observer callback:
     * When an element or a group container enters the viewport, animate it.
     */
    function onIntersect(entries) {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          if (entry.target.hasAttribute('data-animate-group')) {
            animateGroup(entry.target);
          } else {
            animateSingle(entry.target);
          }
          observer.unobserve(entry.target);
        }
      });
    }

    /**
     * Animate a single element into view.
     */
    function animateSingle(el) {
      gsap.to(el, {
        y: 0,
        opacity: 1,
        duration: defaultDuration,
        ease: defaultEase
      });
    }

    /**
     * Animate a group of items with a stagger and also animate nested sub-elements inside each item
     * using an additional delay, while skipping any element marked with [data-no-animate].
     */
    function animateGroup(groupEl) {
      // Get all group items (should have [data-animate] on them)
      const groupItems = groupEl.querySelectorAll('[data-animate]');
      const tl = gsap.timeline({
        defaults: {
          duration: defaultDuration,
          ease: defaultEase
        }
      });

      groupItems.forEach((item, i) => {
        // 1) Animate the group item itself
        tl.to(item, {
          y: 0,
          opacity: 1
        }, i * defaultStagger);

        // 2) Animate sub-elements within the item (headings, custom classes, or [data-animate] elements),
        //    excluding the item itself and any that have [data-no-animate]
        const nestedMatches = Array.from(item.querySelectorAll(combinedSelector))
          .filter(nChild => nChild !== item && !nChild.hasAttribute('data-no-animate'));

        nestedMatches.forEach((nChild, j) => {
          tl.to(nChild, {
            y: 0,
            opacity: 1
          }, i * defaultStagger + (j + 1) * nestedDelayIncrement);
        });
      });
    }
